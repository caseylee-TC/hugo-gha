openapi: 3.0.3
info:
  title: Sample Task API
  description: >
    A small, self-contained example API spec, included purely to show how
    an OpenAPI document can be rendered live on the Hugo site via Redoc.
    It doesn't point at a real server.
  version: "1.0.0"
servers:
  - url: https://api.example.com/v1
paths:
  /tasks:
    get:
      summary: List tasks
      operationId: listTasks
      tags: [Tasks]
      responses:
        "200":
          description: A list of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      summary: Create a task
      operationId: createTask
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTask"
      responses:
        "201":
          description: The created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{taskId}:
    get:
      summary: Get a task by ID
      operationId: getTask
      tags: [Tasks]
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The requested task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
    delete:
      summary: Delete a task
      operationId: deleteTask
      tags: [Tasks]
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
components:
  schemas:
    Task:
      type: object
      properties:
        id:
          type: string
          example: "task_123"
        title:
          type: string
          example: "Write the Hugo scaffold docs"
        done:
          type: boolean
          example: false
      required: [id, title, done]
    NewTask:
      type: object
      properties:
        title:
          type: string
          example: "Write the Hugo scaffold docs"
      required: [title]
